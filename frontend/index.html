<!DOCTYPE html>
<html>
<head>
    <title>KitabGhar - EBooks</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 30px;
        }
        /* Header and Logout Styling */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover {
            background-color: #c82333;
        }
        .book {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            box-shadow: 0 0 6px rgba(0,0,0,0.1);
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📚 Available E-Books</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div id="bookList"></div>

<script src="js/script.js"></script>
</body>
</html>
